<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RoboFleet Lite</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><header><div><span class="eyebrow">WAREHOUSE CONTROL</span><h1>RoboFleet <i>Lite</i></h1></div><span id="connection">Connecting…</span></header>
<main><section class="panel board"><div class="toolbar"><button data-action="start">▶ Start</button><button data-action="pause">Pause</button><button data-action="tick">Step</button><button data-action="reset" class="ghost">Reset</button></div><canvas id="grid" width="800" height="560"></canvas><div class="legend"><span>● Robot</span><span>◆ Pickup</span><span>■ Delivery</span><span>▧ Dynamic obstacle</span></div></section>
